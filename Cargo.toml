[workspace]
members = ["crates/atlas-core"]
resolver = "3"

[package]
name = "atlas"
version = "0.7.0"
edition = "2024"
rust-version = "1.99.1"
default-run = "atlas"
description = "Source-backed Rust navigation, workflows, and architecture diagrams"
repository = "https://github.com/flowerornament/atlas"
include = ["src/**", "docs/**", "PROVENANCE.md", "examples/**", "renderer/**", "vendor/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*", "NOTICE*"]
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
atlas-core = { version = "0.2.0", path = "crates/atlas-core", features = ["clap"] }
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"

[lints]
workspace = true

[workspace.lints.rust]
# Deny unsafe without documented invariants
unsafe_code = "forbid"
# Catch common mistakes
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
# Deny all default + pedantic warnings. Pedantic catches cast bugs,
# float comparison, match duplication — critical for audio correctness.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Restriction lints — opt-in for safety and hygiene
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "deny"
rc_mutex = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
large_stack_arrays = "deny"
mutex_atomic = "deny"
rest_pat_in_fully_bound_structs = "deny"
allow_attributes_without_reason = "deny"

# Nursery lints — opt-in for hygiene
use_self = "warn"

# Pedantic allows — noisy or inapplicable
module_name_repetitions = "allow"
# Rust 1.99: suggests assert_eq!(x, [] as [T; 0]) for assert!(x.is_empty()), which reads worse.
assert_is_empty = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_fields_in_debug = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
trivially_copy_pass_by_ref = "allow"
inline_always = "allow"
if_not_else = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
unreadable_literal = "allow"
