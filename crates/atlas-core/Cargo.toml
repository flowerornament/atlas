[package]
name = "atlas-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Shared read-only Rust source facts, navigation and review mechanisms"
publish = false

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", features = ["full", "visit"] }
tempfile = "3.27.0"
toml = "1.1.8"

[lints]
workspace = true

[features]
clap = ["dep:clap"]
