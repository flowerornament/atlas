[package]
name = "atlas-lib"
version = "0.9.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Library behind cargo-atlas: read-only Rust workspace snapshots, qualified analysis, navigation, change review and architecture checks"
repository = "https://github.com/flowerornament/atlas"
documentation = "https://docs.rs/atlas-lib"
readme = "README.md"
keywords = ["architecture", "static-analysis", "code-review", "syn", "cargo"]
categories = ["development-tools"]
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
syn = { version = "3.0.9", features = ["full", "visit"] }
tempfile = "3.27.0"
toml = "1.1.8"

[lints]
workspace = true

[features]
clap = ["dep:clap"]
